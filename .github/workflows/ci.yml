name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Fuzz duration in seconds
        default: '120'
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Dependencies
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir C:/Qt
          New-Item -ItemType Directory -Path .tools -Force | Out-Null
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.16.zip -OutFile .tools/sdk.zip
          if ((Get-FileHash .tools/sdk.zip).Hash -ne 'F0A8BE7778EE3AE1B99BBBECB27A3FF0F6C111A4093F1C78C5C5A099607184DB') { throw 'SDK hash mismatch' }
          Expand-Archive .tools/sdk.zip .tools/npcap-sdk
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1 -Test -QtRoot C:/Qt/6.8.3/msvc2022_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-tests
          path: output/evidence/*.xml
          retention-days: 7
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-18 clang-tidy-18 ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build/core -G Ninja -DETHERSCOPE_BUILD_GUI=OFF
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-18 -DETHERSCOPE_BUILD_FUZZERS=ON
          '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer'
          '-DCMAKE_CXX_CLANG_TIDY=clang-tidy-18;--checks=-*,clang-analyzer-*;--warnings-as-errors=*'
      - run: cmake --build build/core
      - run: ctest --test-dir build/core --output-on-failure --output-junit tests.xml
      - name: Fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '120' }}
        run: |
          case "$FUZZ_SECONDS" in *[!0-9]*|'') exit 2;; esac
          test "$FUZZ_SECONDS" -ge 1 && test "$FUZZ_SECONDS" -le 1800
          build/core/make_fuzz_corpus build/corpus
          mkdir -p build/fuzz-failures
          build/core/packet_fuzzer build/corpus -max_len=65540 -timeout=5 -rss_limit_mb=512 -max_total_time="$FUZZ_SECONDS" -artifact_prefix=build/fuzz-failures/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-tests
          path: |
            build/core/tests.xml
            build/fuzz-failures/
          retention-days: 7
